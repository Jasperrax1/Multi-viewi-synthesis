<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程相机 · P0 桌面接收验证</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif}body{margin:0 auto;padding:20px;max-width:1100px;background:#101820;color:#edf3f6}h1{font-size:24px}fieldset{border:1px solid #506274;border-radius:8px;margin:16px 0}label{display:inline-block;margin:8px}input,button{font:inherit;padding:10px;border-radius:5px;border:1px solid #718697}button{cursor:pointer;background:#bad8f0;color:#122334}button:disabled{opacity:.5}video{width:100%;max-height:65vh;object-fit:contain;background:#000}pre{white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}.note{color:#c3d3df}#photo a{color:#b2e1ff}
</style></head><body>
<h1>远程相机 · 接收验证</h1><p class="note">连接 Android 拍摄端时接收真实相机画面与原 JPEG；连接电脑测试源时接收合成数据。电脑接收测试不能替代双手机验收。控制/照片通过可信 LAN 明文传输。</p>
<fieldset id="desktopControls"><legend>连接测试服务</legend><label>地址 <input id="address" placeholder="http://192.168.1.2:8787" size="30"></label><label>一次性配对码 <input id="code" inputmode="numeric" maxlength="6" size="8" autocomplete="off"></label><button id="connect">配对并连接</button> <button id="disconnect" disabled>断开</button><p id="connection" role="status">未连接</p><button id="shutter" disabled>拍摄 JPEG</button> <button id="export">导出诊断 JSON</button><p id="photo" role="status"></p></fieldset>
<video id="remoteVideo" autoplay muted playsinline></video><p><button id="play">播放 / 重试播放</button> <span id="playback" role="status">等待会话</span></p><details open><summary>接收诊断（null 表示字段不可用；RTT 不是光学端到端延迟）</summary><pre id="stats">等待统计</pre></details>
<script src="webrtc-core.js"></script><script src="receiver.js"></script><script src="receiver-browser.js"></script></body></html>
